<rect x="500" y="300" width="430" height="64" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="2"/>
<text x="715.0" y="327.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Step 2</text>
<text x="715.0" y="349.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">answer: there is an outage, wait</tspan></text>
<polyline points="715,192 715,218" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
