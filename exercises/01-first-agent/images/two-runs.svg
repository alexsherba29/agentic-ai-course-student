<text x="500" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#9a3412">VPN status: outage</text>
<rect x="500" y="128" width="430" height="64" rx="10" fill="#e8f6fb" stroke="#2b8db3" stroke-width="2"/>
