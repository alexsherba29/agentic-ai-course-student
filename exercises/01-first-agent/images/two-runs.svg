<text x="245.0" y="349.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">lookup_solution(…)  → a guide</tspan></text>
<polyline points="245,192 245,218" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="245,272 245,296" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
