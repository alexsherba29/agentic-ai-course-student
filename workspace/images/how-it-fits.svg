<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="How the pieces fit together">
<title>How the pieces fit together</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#004a2c"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<rect x="1" y="1" width="958" height="8" rx="4" fill="#004a2c"/>
<text x="28" y="44" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#004a2c">How the pieces fit together</text>
<text x="28" y="70" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#4b5563">Your agent never talks to a model or an IT system directly: it goes through common/.</text>
<rect x="30" y="190" width="210" height="110" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
<text x="135.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#713f12">Your agent</text>
<text x="135.0" y="252.0" font-size="14" text-anchor="middle"><tspan font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#1f2937">starter/agent.py</tspan></text>
<text x="135.0" y="272.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">the loop you write</tspan></text>
<rect x="330" y="100" width="240" height="90" rx="10" fill="#e8f6fb" stroke="#2b8db3" stroke-width="2"/>
<text x="450.0" y="140.0" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#004a2c">common/llm.py</text>
<text x="450.0" y="162.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">one way to ask any model</tspan></text>
<rect x="660" y="92" width="270" height="50" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="2"/>
<text x="795.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Ollama  (real model)</text>
<rect x="660" y="152" width="270" height="50" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="182.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">FakeLLM  (pretend model)</text>
<text x="795" y="222" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#4b5563" font-style="italic">same question → same answer, every time</text>
<polyline points="240,225 285,225 285,145 326,145" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="292" y="195" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#004a2c">asks</text>
<polyline points="570,135 656,117" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
<polyline points="570,150 656,177" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
<rect x="330" y="300" width="240" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="450.0" y="340.0" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">starter/tools.py</text>
<text x="450.0" y="362.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">the actions it may take</tspan></text>
<rect x="660" y="262" width="270" height="180" rx="10" fill="#e8f6fb" stroke="#2b8db3" stroke-width="2"/>
<text x="795.0" y="307.0" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#004a2c">common/mocks/</text>
<text x="795.0" y="329.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">pretend IT systems, in memory:</tspan></text>
<text x="795.0" y="349.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">status page · ticket system</tspan></text>
<text x="795.0" y="369.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">support guides</tspan></text>
<text x="795.0" y="389.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">They can fail on purpose</tspan></text>
<text x="795.0" y="409.0" font-size="14" text-anchor="middle"><tspan font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#4b5563">(fail_mode) to test your code.</tspan></text>
<polyline points="240,265 285,265 285,345 326,345" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="292" y="300" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#004a2c">runs</text>
<text x="292" y="316" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#004a2c">a tool</text>
<polyline points="570,345 656,345" fill="none" stroke="#004a2c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-green)"/>
</svg>
